<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
<title id="title">ShellOOD: radius-shell self-supervision</title><desc id="desc">ID-only warm-up establishes a reference radius. Cross-class feature mixup and an auxiliary shell head train synthetic features toward inner shells. Only the classifier and backbone are used at inference.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#728497"/></marker></defs>
<rect width="800" height="480" fill="#f7f9fc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="25" y="33" font-size="20" fill="#245895" text-anchor="start" font-weight="600">ShellOOD</text>
<text x="25" y="59" font-size="16" fill="#596674" text-anchor="start" font-weight="400">Use ID feature geometry to teach OOD awareness.</text>
<rect x="25" y="89" width="280" height="353" rx="8" fill="#fff" stroke="#b8c5d4" stroke-width="1.5"/>
<circle cx="165" cy="230" r="98" fill="none" stroke="#245895" stroke-width="1.6"/>
