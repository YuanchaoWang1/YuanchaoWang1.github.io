<text x="165" y="116" font-size="18" fill="#202831" text-anchor="middle" font-weight="600">Centered feature space</text>
<text x="165" y="360" font-size="18" fill="#245895" text-anchor="middle" font-weight="400">Typical ID radius</text>
<text x="165" y="389" font-size="17" fill="#a85b14" text-anchor="middle" font-weight="400">Inner pseudo-OOD shells</text>
<text x="165" y="419" font-size="15" fill="#596674" text-anchor="middle" font-weight="400">Schematic geometry</text>
<rect x="350" y="90" width="420" height="65" rx="8" fill="#eaf1fa" stroke="#b8c5d4" stroke-width="1.5"/>
<text x="560.0" y="129.15" font-size="19" fill="#245895" text-anchor="middle" font-weight="400">Warm up on ID data</text>
<path d="M560,155 L560,184" fill="none" stroke="#728497" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="184" width="420" height="65" rx="8" fill="#fff2e3" stroke="#b8c5d4" stroke-width="1.5"/>
