<circle cx="249.870489570875" cy="279.0" r="5" fill="#387d7a" stroke="none" stroke-width="1.6"/>
<circle cx="242.870489570875" cy="283.0" r="5" fill="#387d7a" stroke="none" stroke-width="1.6"/>
<circle cx="255.870489570875" cy="285.0" r="5" fill="#387d7a" stroke="none" stroke-width="1.6"/>
<circle cx="80.129510429125" cy="279.0" r="5" fill="#605492" stroke="none" stroke-width="1.6"/>
<circle cx="73.129510429125" cy="283.0" r="5" fill="#605492" stroke="none" stroke-width="1.6"/>
