<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 700" role="img" aria-labelledby="title desc">
<title id="title">OOD-TV-IRM: primal-dual invariant learning</title><desc id="desc">Training environments feed a shared model. Primal descent updates features; dual ascent updates the learned TV multiplier.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#728497"/></marker></defs>
<rect width="420" height="700" fill="#f7f9fc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="25" y="33" font-size="20" fill="#245895" text-anchor="start" font-weight="600">OOD-TV-IRM</text>
<rect x="35" y="65" width="350" height="65" rx="8" fill="#fff" stroke="#b8c5d4" stroke-width="1.5"/>
<text x="210.0" y="104.15" font-size="19" fill="#202831" text-anchor="middle" font-weight="400">Multiple training environments</text>
<path d="M210,130 L210,160" fill="none" stroke="#728497" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="160" width="290" height="70" rx="8" fill="#eaf1fa" stroke="#b8c5d4" stroke-width="1.5"/>
<text x="210.0" y="188.15" font-size="19" fill="#202831" text-anchor="middle" font-weight="400">Shared feature extractor</text>
<text x="210.0" y="215.15" font-size="19" fill="#202831" text-anchor="middle" font-weight="400">and prediction risks</text>
<path d="M210,230 L210,270" fill="none" stroke="#728497" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="270" width="350" height="90" rx="8" fill="#fff" stroke="#b8c5d4" stroke-width="1.5"/>
<text x="210.0" y="308.15" font-size="19" fill="#202831" text-anchor="middle" font-weight="400">Prediction risk</text>
<text x="210.0" y="335.15" font-size="19" fill="#202831" text-anchor="middle" font-weight="400">+ learned weight × TV penalty</text>
<path d="M210,360 L210,400 L110,400 L110,430" fill="none" stroke="#728497" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M210,400 L310,400 L310,430" fill="none" stroke="#728497" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="430" width="175" height="100" rx="8" fill="#eaf1fa" stroke="#b8c5d4" stroke-width="1.5"/>
<text x="112.5" y="473.3" font-size="18" fill="#245895" text-anchor="middle" font-weight="400">Primal descent</text>
<text x="112.5" y="499.3" font-size="18" fill="#245895" text-anchor="middle" font-weight="400">Update features</text>
<rect x="220" y="430" width="175" height="100" rx="8" fill="#fff2e3" stroke="#b8c5d4" stroke-width="1.5"/>
<text x="307.5" y="473.3" font-size="18" fill="#a85b14" text-anchor="middle" font-weight="400">Dual ascent</text>
<text x="307.5" y="499.3" font-size="18" fill="#a85b14" text-anchor="middle" font-weight="400">Update penalty</text>
<path d="M110,530 L110,565 L310,565 L310,530" fill="none" stroke="#728497" stroke-width="2"/>
<text x="210" y="605" font-size="18" fill="#596674" text-anchor="middle" font-weight="400">Alternate the two updates</text>
<text x="210" y="631" font-size="18" fill="#596674" text-anchor="middle" font-weight="400">to couple prediction and invariance.</text>
<text x="210" y="668" font-size="15" fill="#596674" text-anchor="middle" font-weight="400">Known-environment form · Schematic</text>
</g></svg>
