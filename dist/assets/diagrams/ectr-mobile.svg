<rect x="25" y="68" width="175" height="95" rx="8" fill="#fff" stroke="#b8c5d4" stroke-width="1.5"/>
<text x="40" y="96" font-size="18" fill="#202831" text-anchor="start" font-weight="600">Environment 1</text>
<circle cx="50.0" cy="132" r="6" fill="#245895" stroke="none" stroke-width="1.6"/>
<circle cx="81.25" cy="132" r="6" fill="#245895" stroke="none" stroke-width="1.6"/>
