<text x="210.0" y="271.8" font-size="18" fill="#245895" text-anchor="middle" font-weight="400">Normalize within each environment</text>
<path d="M210,300 L210,317 L112,317 L112,335" fill="none" stroke="#728497" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M210,317 L308,317 L308,335" fill="none" stroke="#728497" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="25" y="335" width="175" height="95" rx="8" fill="#fff" stroke="#b8c5d4" stroke-width="1.5"/>
