<circle cx="175.0" cy="132" r="6" fill="#a85b14" stroke="none" stroke-width="1.6"/>
<rect x="220" y="68" width="175" height="95" rx="8" fill="#fff" stroke="#b8c5d4" stroke-width="1.5"/>
<text x="235" y="96" font-size="18" fill="#202831" text-anchor="start" font-weight="600">Environment 2</text>
<circle cx="245.0" cy="132" r="6" fill="#245895" stroke="none" stroke-width="1.6"/>
<circle cx="276.25" cy="132" r="6" fill="#245895" stroke="none" stroke-width="1.6"/>
<circle cx="307.5" cy="132" r="6" fill="#245895" stroke="none" stroke-width="1.6"/>
<circle cx="338.75" cy="132" r="6" fill="#245895" stroke="none" stroke-width="1.6"/>
<circle cx="370.0" cy="132" r="6" fill="#a85b14" stroke="none" stroke-width="1.6"/>
<path d="M112,163 L112,185 L210,185 L210,205" fill="none" stroke="#728497" stroke-width="2" marker-end="url(#arrow)"/>
