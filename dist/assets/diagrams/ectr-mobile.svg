<text x="210.0" y="544.65" font-size="19" fill="#245895" text-anchor="middle" font-weight="400">Prediction loss + TV penalty</text>
<rect x="30" y="600" width="360" height="60" rx="8" fill="#fff2e3" stroke="#b8c5d4" stroke-width="1.5"/>
