<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 700" role="img" aria-labelledby="title desc">
<title id="title">ShellOOD: radius-shell self-supervision</title><desc id="desc">ID-only warm-up establishes a reference radius. Cross-class feature mixup and an auxiliary shell head train synthetic features toward inner shells. Only the classifier and backbone are used at inference.</desc>
