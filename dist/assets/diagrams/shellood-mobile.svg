<text x="210" y="57" font-size="18" fill="#245895" text-anchor="middle" font-weight="400">Warm up on ID data</text>
<text x="210" y="295" font-size="17" fill="#245895" text-anchor="middle" font-weight="400">Outer radius: typical ID features</text>
<text x="210" y="322" font-size="17" fill="#a85b14" text-anchor="middle" font-weight="400">Inner shells: synthetic features</text>
<rect x="45" y="350" width="330" height="60" rx="8" fill="#fff2e3" stroke="#b8c5d4" stroke-width="1.5"/>
